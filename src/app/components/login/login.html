<div class="flex min-h-screen items-center justify-center bg-slate-100 px-4">
  <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-xl">
    <div class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-slate-800">Welcome Back</h1>
      <p class="mt-2 text-slate-500">
        Sign in to continue
      </p>
    </div>

    <form (ngSubmit)="login()" #loginForm="ngForm" class="space-y-5">

      <div>
        <label class="mb-2 block font-medium text-slate-700">
          Username
        </label>

        <input
          type="text"
          name="username"
          [(ngModel)]="username"
          required
          class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none transition focus:border-indigo-500"
          placeholder="Enter username"
        />
      </div>

      <div>
        <label class="mb-2 block font-medium text-slate-700">
          Password
        </label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none transition focus:border-indigo-500"
          placeholder="Enter password"
        />
      </div>

      <div
        *ngIf="errorMessage"
        class="rounded-lg bg-red-100 p-3 text-sm text-red-600"
      >
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        class="w-full rounded-lg bg-indigo-600 py-3 font-semibold text-white transition hover:bg-indigo-700"
      >
        Login
      </button>

    </form>

    <div class="mt-6 rounded-lg bg-slate-100 p-4 text-sm text-slate-600">
      <p><strong>Demo Credentials</strong></p>
      <p>Username: admin</p>
      <p>Password: admin</p>
    </div>
  </div>
</div>
